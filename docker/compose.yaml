services:
  sofamous:
    image: ghcr.io/tydoo/sofamous.fr:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-latest}
    ports:
      - "443:443"
    stop_grace_period: 1h
    volumes:
      - /etc/ssl/certs/sofamous.fr.pem:/etc/ssl/certs/sofamous.fr.pem:ro
      - /etc/ssl/private/sofamous.fr.key:/etc/ssl/private/sofamous.fr.key:ro
    command:
      - sh
      - -c
      - "php bin/console doctrine:migrations:migrate --no-interaction --env=prod && exec supervisord -c /etc/supervisor/supervisord.conf"
