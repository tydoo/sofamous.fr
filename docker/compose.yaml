# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
  sofamous:
    image: ghcr.io/tydoo/sofamous.fr:latest
    restart: unless-stopped
    ports:
      - "443:443"
    stop_grace_period: 1h
    volumes:
      - /etc/ssl/certs/sofamous.fr.pem:/etc/ssl/certs/sofamous.fr.pem:ro
      - /etc/ssl/private/sofamous.fr.key:/etc/ssl/private/sofamous.fr.key:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      - known_hosts_data:/root/.ssh/known_hosts
    command:
      - sh
      - -c
      - "mkdir -p config/secrets/prod && GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/root/.ssh/known_hosts' git clone --depth 1 git@github.com:tydoo/Decrypt-file-prod-sofamous.fr.git /tmp/decrypt-repo && cp /tmp/decrypt-repo/prod.decrypt.private.php config/secrets/prod/prod.decrypt.private.php && rm -rf /tmp/decrypt-repo && php bin/console doctrine:migrations:migrate --no-interaction --env=prod && exec supervisord -c /etc/supervisor/supervisord.conf"

volumes:
  known_hosts_data:
