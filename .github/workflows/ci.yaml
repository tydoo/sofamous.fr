name: Pipeline-CI
on:
  push:
    branches: [ main ]
jobs:
  ci:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP, extensions and composer with shivammathur/setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, iconv, json, mbstring, pdo

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
          enableCrossOsArchive: false
          fail-on-cache-miss: false

      - name: "Composer install"
        run: composer install --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Symfony CLI
        run: |
          curl -sS https://get.symfony.com/cli/installer | bash
          mv /home/runner/.symfony5/ /home/runner/.config/symfony-cli/
          mv /home/runner/.config/symfony-cli/bin/symfony /usr/local/bin/symfony

      - name: Symfony Check Vulnerabilities
        run: symfony check:security

      - name: Lint YAML files
        run: symfony console lint:yaml config --parse-tags

      - name: Lint Twig templates
        run: symfony console lint:twig templates --env=prod

      - name: Lint Parameters and Services
        run: symfony console lint:container --no-debug

      - name: Lint Doctrine entities
        run: symfony console doctrine:schema:validate --skip-sync -vvv --no-interaction
