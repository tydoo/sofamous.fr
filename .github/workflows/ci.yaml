name: Pipeline-CI
on:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP, extensions and composer with shivammathur/setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, iconv, json, mbstring, pdo

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
          enableCrossOsArchive: false
          fail-on-cache-miss: false

      - name: "Composer install"
        run: composer install --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Symfony CLI
        run: |
          curl -sS https://get.symfony.com/cli/installer | bash
          mv /home/runner/.symfony5/ /home/runner/.config/symfony-cli/
          mv /home/runner/.config/symfony-cli/bin/symfony /usr/local/bin/symfony

      - name: Symfony Check Vulnerabilities
        run: symfony check:security

      - name: Lint YAML files
        run: symfony console lint:yaml config --parse-tags

      - name: Lint Twig templates
        run: symfony console lint:twig templates --env=prod

      - name: Lint Parameters and Services
        run: symfony console lint:container --no-debug

      - name: Lint Doctrine entities
        run: symfony console doctrine:schema:validate --skip-sync -vvv --no-interaction

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image version
        id: version
        run: |
          weekday=$(date -u +%u)
          now=$(date -u +%s)
          week_start_epoch=$((now - (weekday - 1) * 86400 - now % 86400))
          week_start=$(date -u -d "@$week_start_epoch" +%Y-%m-%dT%H:%M:%SZ)
          commit_number=$(git rev-list --count --since="$week_start" "$GITHUB_SHA")
          echo "tag=$(date -u +'%G.%V').$commit_number" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
